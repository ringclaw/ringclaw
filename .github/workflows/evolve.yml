name: Evolve Prompts

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: 'Number of mutation rounds per prompt'
        required: false
        default: '5'

permissions:
  contents: write
  pull-requests: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.2'

      - name: Run prompt evolution
        id: evolve
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          go run scripts/eval_prompt.go \
            --prompt all \
            --evolve ${{ github.event.inputs.rounds || '5' }} \
            --min-improvement 3 \
            --markdown evolve-report.md \
            && echo "improved=true" >> "$GITHUB_OUTPUT" \
            || echo "improved=false" >> "$GITHUB_OUTPUT"

      - name: Create PR with evolved prompts
        if: steps.evolve.outputs.improved == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="evolve/prompts-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"

          # List evolved prompts
          for prompt in intent name_extract action; do
            EVOLVED="output/prompt-eval/${prompt}/evolved.md"
            if [ -f "$EVOLVED" ]; then
              echo "Found evolved prompt: $prompt ($(wc -c < "$EVOLVED") chars)"
            fi
          done

          # Commit evolved prompts + summary
          git add output/prompt-eval/*/evolved.md output/prompt-eval/*/report.json
          git add output/prompt-eval/evolve-summary.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: evolved prompts via automated mutation"

          git push origin "$BRANCH"

          # Build PR body file to avoid shell quoting issues
          cp evolve-report.md pr-body.md
          echo "" >> pr-body.md
          echo "---" >> pr-body.md
          echo "*Auto-generated by [Evolve Prompts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) workflow.*" >> pr-body.md
          echo "*Review the evolved prompts in \`output/prompt-eval/*/evolved.md\` and apply to \`messaging/prompts.go\` if appropriate.*" >> pr-body.md

          gh pr create \
            --title "Evolved prompts ($(date +%Y-%m-%d))" \
            --body-file pr-body.md \
            --base main \
            --head "$BRANCH"

      - name: Summary
        if: always()
        run: |
          if [ -f evolve-report.md ]; then
            cat evolve-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No evolution report generated." >> "$GITHUB_STEP_SUMMARY"
          fi
