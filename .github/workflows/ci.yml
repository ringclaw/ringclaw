name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.2'

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -count=1 -race -v -coverprofile=coverage.out

      - name: Check prompt/dataset changes
        id: prompt-changes
        run: |
          BASE=${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
          CHANGED=$(git diff --name-only "$BASE" HEAD -- 'messaging/prompts.go' 'datasets/prompts/' 'scripts/eval_prompt.go' || true)
          if [ -n "$CHANGED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Prompt/dataset files changed:"
            echo "$CHANGED"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No prompt/dataset changes, skipping eval"
          fi

      - name: Eval prompts
        if: steps.prompt-changes.outputs.changed == 'true' && env.LLM_API_KEY != ''
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: go run scripts/eval_prompt.go --prompt all --markdown eval-report.md

      - name: Eval summary
        if: steps.prompt-changes.outputs.changed == 'true' && hashFiles('eval-report.md') != ''
        run: cat eval-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment eval on PR
        if: steps.prompt-changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f eval-report.md ]; then exit 0; fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          else
            PR_NUMBER=$(gh pr list --head "${{ github.ref_name }}" --json number -q '.[0].number')
          fi
          if [ -z "$PR_NUMBER" ]; then exit 0; fi
          BODY=$(cat eval-report.md)
          COMMENT_TAG="<!-- prompt-eval -->"
          gh pr comment "$PR_NUMBER" --body "${COMMENT_TAG}
          ${BODY}" 2>/dev/null || true

      - name: SonarCloud Scan
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.2'

      - name: Determine version
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "version=v0.0.0-beta+${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "version=v0.0.0-alpha+${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          go build -trimpath -ldflags="-s -w -X github.com/ringclaw/ringclaw/cmd.Version=${{ steps.version.outputs.version }} -X github.com/ringclaw/ringclaw/cmd.Commit=${{ github.sha }}" \
            -o ringclaw_${{ matrix.goos }}_${{ matrix.goarch }}${EXT} .

      - uses: actions/upload-artifact@v7
        with:
          name: ringclaw_${{ matrix.goos }}_${{ matrix.goarch }}
          path: ringclaw_${{ matrix.goos }}_${{ matrix.goarch }}*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum ringclaw_* > checksums.txt

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=beta-latest" >> "$GITHUB_OUTPUT"
            echo "name=Beta (main @ $(echo ${{ github.sha }} | cut -c1-7))" >> "$GITHUB_OUTPUT"
          else
            SAFE_BRANCH=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
            echo "tag=alpha-${SAFE_BRANCH}" >> "$GITHUB_OUTPUT"
            echo "name=Alpha (${SAFE_BRANCH} @ $(echo ${{ github.sha }} | cut -c1-7))" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${{ steps.tag.outputs.tag }}" --repo "${{ github.repository }}" --yes 2>/dev/null || true

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: |
            dist/ringclaw_*
            dist/checksums.txt
          body: |
            Pre-release build from `${{ github.ref_name }}` branch.
            Commit: ${{ github.sha }}
