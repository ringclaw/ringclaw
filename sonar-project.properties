sonar.projectKey=ringclaw
sonar.organization=ringclaw
sonar.projectName=RingClaw

# Sources
sonar.sources=.
sonar.exclusions=**/*_test.go,internal/testutil/**,docs/**,scripts/**,.spec-workflow/**,.openapi/**

# Tests
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Coverage
sonar.go.coverage.reportPaths=coverage.out
# Conservative coverage exclusions. cmd/** is excluded because CLI entry
# points wrap cobra wiring + os.Exit and resist meaningful unit testing.
# main.go is just `cmd.Execute()`. platform_*.go files are build-tag glue
# that never compile together. ringcentral/types.go is pure JSON struct
# definitions. agent/registry.go is adapter glue exercised through every
# concrete agent test.
sonar.coverage.exclusions=cmd/**,docs/**,internal/testutil/**,main.go,**/platform_unix.go,**/platform_windows.go,ringcentral/types.go,agent/registry.go

# Duplicate detection — lower threshold for Go (default 10 is too noisy)
sonar.cpd.go.minimumTokens=50

# Encoding
sonar.sourceEncoding=UTF-8

# Links
sonar.links.homepage=https://github.com/ringclaw/ringclaw
sonar.links.scm=https://github.com/ringclaw/ringclaw
sonar.links.issue=https://github.com/ringclaw/ringclaw/issues
sonar.links.ci=https://github.com/ringclaw/ringclaw/actions
