sonar.projectKey=ringclaw
sonar.organization=ringclaw
sonar.projectName=RingClaw

# Sources
sonar.sources=.
sonar.exclusions=**/*_test.go,internal/testutil/**,docs/**,scripts/**,.spec-workflow/**,.openapi/**

# Tests
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Coverage
sonar.go.coverage.reportPaths=coverage.out

# Duplicate detection — lower threshold for Go (default 10 is too noisy)
sonar.cpd.go.minimumTokens=50

# Encoding
sonar.sourceEncoding=UTF-8

# Links
sonar.links.homepage=https://github.com/ringclaw/ringclaw
sonar.links.scm=https://github.com/ringclaw/ringclaw
sonar.links.issue=https://github.com/ringclaw/ringclaw/issues
sonar.links.ci=https://github.com/ringclaw/ringclaw/actions
